# =============================================================================
# GREENHOUSE IoT PLATFORM — Docker Compose
# Phase 1: Infrastructure (EMQX + PostgreSQL + Redis)
# =============================================================================
# Usage:
#   1. cp .env.example .env
#   2. Edit .env with your passwords
#   3. docker compose up -d
#   4. docker compose ps
# =============================================================================

name: greenhouse

services:
  # ---------------------------------------------------------------------------
  # EMQX — MQTT Broker
  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.8.6
    container_name: greenhouse-emqx
    restart: unless-stopped

    environment:
      EMQX_NAME: greenhouse-emqx
      EMQX_HOST: 127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Set EMQX_NODE_COOKIE from a secret manager}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_DEFAULT_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_DEFAULT_PASSWORD:?Set EMQX_DASHBOARD_DEFAULT_PASSWORD from a secret manager}

    ports:
      - "127.0.0.1:${EMQX_MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${EMQX_DASHBOARD_PORT:-18083}:18083"

    volumes:
      - ./infrastructure/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

    networks:
      - greenhouse-network

    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: greenhouse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenhouse_db}
      POSTGRES_USER: ${POSTGRES_USER:-greenhouse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      # Store data in UTC
      PGTZ: UTC
      TZ: UTC

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - greenhouse-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenhouse_user} -d ${POSTGRES_DB:-greenhouse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — Cache & Realtime State
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: greenhouse-redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme123}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    networks:
      - greenhouse-network

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  emqx_data:
    name: greenhouse_emqx_data
  emqx_log:
    name: greenhouse_emqx_log
  postgres_data:
    name: greenhouse_postgres_data
  redis_data:
    name: greenhouse_redis_data

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  greenhouse-network:
    name: greenhouse-network
    driver: bridge