# =============================================================================
# EMQX ACL Rules — Greenhouse IoT Platform
# =============================================================================
# Format: {allow|deny} {user|group|all} {ClientID|Username|all} {publish|subscribe|all} {TopicPattern}
#
# Rules are evaluated in order. First match wins.
#
# Topic convention:
#   greenhouse/{greenhouse_id}/{device_id}/{message_type}
#
# Message types:
#   telemetry  — sensor data from device to backend
#   status     — device online/offline status
#   event      — device events
#   alarm      — device alarms
#   command    — commands from backend to device
#   response   — command response from device to backend
#   config     — configuration from backend to device
# =============================================================================

# NestJS backend: full access to all greenhouse topics
{allow, {user, "nestjs_backend"}, all, ["greenhouse/#"]}.

# Deny all by default (any client not matched above)
{deny, all, all, ["greenhouse/#"]}.
