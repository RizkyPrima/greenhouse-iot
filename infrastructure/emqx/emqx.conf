##--------------------------------------------------------------------
## EMQX Configuration — local development broker
##--------------------------------------------------------------------
## This listener is bound to the host loopback by docker-compose.yml.
## Production uses emqx.production.conf and an MQTT-over-TLS listener.
##--------------------------------------------------------------------

authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  cache { enable = false }
  sources = [
    { type = built_in_database }
  ]
}

listeners.tcp.default {
  enable = true
  bind = "0.0.0.0:1883"
  max_connections = 10240
}

listeners.ssl.default { enable = false }
listeners.ws.default { enable = false }
listeners.wss.default { enable = false }

dashboard.listeners.http.bind = 18083
log.console.level = warning
