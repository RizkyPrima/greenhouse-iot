##--------------------------------------------------------------------
## EMQX Configuration — Greenhouse IoT Platform (Development)
##--------------------------------------------------------------------
## This file overrides EMQX defaults for development environment.
## For production, use proper TLS and external auth database.
##--------------------------------------------------------------------

## Node name
node.name = greenhouse-emqx@127.0.0.1

## Dashboard
dashboard.listeners.http.bind = 18083
dashboard.default_username = admin
dashboard.default_password = change_me_emqx_dashboard_password

## MQTT listener (plain)
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

## MQTT over WebSocket
listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}

## Log level
log.console.level = warning
