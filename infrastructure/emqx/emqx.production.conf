authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  cache { enable = false }
  sources = [
    { type = built_in_database }
  ]
}

listeners.tcp.default { enable = false }
listeners.ws.default { enable = false }
listeners.wss.default { enable = false }

listeners.ssl.default {
  enable = true
  bind = "0.0.0.0:8883"
  max_connections = 10240
  ssl_options {
    certfile = "/opt/emqx/etc/certs/server.pem"
    keyfile = "/opt/emqx/etc/certs/server-key.pem"
  }
}

dashboard.listeners.http { enable = false }

dashboard.listeners.https {
  bind = "0.0.0.0:18084"
  ssl_options {
    certfile = "/opt/emqx/etc/certs/server.pem"
    keyfile = "/opt/emqx/etc/certs/server-key.pem"
  }
}

log.console.level = warning
